<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms Dashboard — NitroIDE (private)</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #08080c; color: #e4e4e7; font-family: Inter, system-ui, -apple-system, sans-serif; min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.5px; }
  h1 span { color: #00e5ff; }
  .sub { color: #71717a; font-size: 13px; margin-bottom: 28px; }
  .card { background: #131318; border: 1px solid #26262b; border-radius: 14px; padding: 22px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: #131318; border: 1px solid #26262b; border-radius: 12px; padding: 16px; }
  .stat .n { font-size: 26px; font-weight: 800; color: #00e5ff; }
  .stat .l { font-size: 12px; color: #71717a; margin-top: 4px; }
  input, select { background: #0b0b10; border: 1px solid #26262b; color: #e4e4e7; border-radius: 10px; padding: 11px 14px; font-size: 14px; width: 100%; }
  input:focus, select:focus { outline: none; border-color: #00e5ff; }
  button { background: #00e5ff; color: #000; border: 0; border-radius: 999px; padding: 11px 26px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid #26262b; color: #e4e4e7; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .err { color: #f87171; font-size: 13px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: #71717a; font-weight: 600; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid #26262b; }
  td { padding: 12px; border-bottom: 1px solid #1b1b21; vertical-align: top; }
  tr:hover td { background: #16161c; }
  .pill { display: inline-block; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: #0b0b10; border: 1px solid #26262b; color: #a1a1aa; }
  .pill.contact { color: #00e5ff; border-color: #00e5ff44; }
  .msg { max-width: 420px; white-space: pre-wrap; word-break: break-word; color: #d4d4d8; }
  .meta { font-size: 12px; color: #71717a; margin-top: 6px; }
  .hidden { display: none !important; }
  .live { font-size: 12px; color: #4ade80; margin-left: 8px; }
  .upd { font-size: 12px; color: #71717a; margin-left: 6px; }
  .msg.clamp { max-height: 88px; overflow: hidden; }
  .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .mini { background: transparent; border: 1px solid #26262b; color: #a1a1aa; border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .mini:hover { border-color: #00e5ff; color: #00e5ff; }
  .mini.danger:hover { border-color: #f87171; color: #f87171; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input { max-width: 320px; }
  @media (max-width: 640px) { table, thead, tbody, th, td, tr { display: block; } thead { display: none; } td { border: 0; padding: 6px 0; } tr { border-bottom: 1px solid #26262b; padding: 10px 0; display: block; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ NitroIDE <span>Forms Dashboard</span></h1>
  <p class="sub">Private — submission archive, stats &amp; export. Not linked anywhere on the site.</p>

  <div class="card" id="loginCard">
    <div class="row">
      <input type="password" id="tokenInput" placeholder="Paste ADMIN_TOKEN" style="flex:1;min-width:220px" autocomplete="off" aria-label="Admin token">
      <button onclick="login()">Unlock</button>
    </div>
    <div class="err hidden" id="loginErr"></div>
  </div>

  <div id="dash" class="hidden">
    <div class="stats" id="statsRow"></div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <div class="row"><strong>Recent submissions</strong><span class="live">● Live</span><span class="upd" id="updLabel"></span></div>
        <div class="row">
          <button class="ghost" onclick="refreshAll()">⟳ Refresh</button>
          <button class="ghost" onclick="exportCsv()">⬇ Export CSV</button>
          <button class="ghost" onclick="logout()">Lock</button>
        </div>
      </div>
      <div class="toolbar">
        <input id="searchInput" placeholder="Search name, email, message..." autocomplete="off" aria-label="Search submissions">
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>When (IST)</th><th>Form</th><th>From</th><th>Heard via</th><th>Message</th></tr></thead>
          <tbody id="subsBody"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:14px;justify-content:center">
        <button class="ghost hidden" id="moreBtn" onclick="loadMore()">Load more</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var token = sessionStorage.getItem("forms_admin_token") || "";
  var cursor = null;
  var loggedIn = false;
  var lastUpdated = 0;
  var pagesLoaded = 0;

  function applyFilter() {
    var q = document.getElementById("searchInput").value.trim().toLowerCase();
    var rows = document.getElementById("subsBody").rows;
    for (var i = 0; i < rows.length; i++) {
      rows[i].style.display = !q || rows[i].textContent.toLowerCase().indexOf(q) !== -1 ? "" : "none";
    }
  }
  document.getElementById("searchInput").addEventListener("input", applyFilter);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(path) {
    return fetch(path, { headers: { "Authorization": "Bearer " + token } });
  }

  window.login = function () {
    token = document.getElementById("tokenInput").value.trim();
    if (!token) return;
    sessionStorage.setItem("forms_admin_token", token);
    boot();
  };
  window.logout = function () {
    token = "";
    loggedIn = false;
    lastUpdated = 0;
    sessionStorage.removeItem("forms_admin_token");
    document.getElementById("dash").classList.add("hidden");
    document.getElementById("loginCard").classList.remove("hidden");
    document.getElementById("tokenInput").value = "";
  };
  document.getElementById("tokenInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") login();
  });

  function tickUpdLabel() {
    var el = document.getElementById("updLabel");
    if (!lastUpdated) { el.textContent = ""; return; }
    var s = Math.max(0, Math.round((Date.now() - lastUpdated) / 1000));
    el.textContent = s < 5 ? "updated just now" : "updated " + s + "s ago";
  }

  window.refreshAll = function () {
    api("/api/forms/admin/stats").then(function (r) {
      if (r.status === 401) { logout(); throw new Error("Session expired."); }
      if (!r.ok) throw new Error("refresh failed");
      return r.json();
    }).then(function (d) {
      renderStats(d);
      // Re-fetch the same pagination depth the user already loaded.
      var want = Math.max(1, pagesLoaded);
      document.getElementById("subsBody").innerHTML = "";
      cursor = null;
      pagesLoaded = 0;
      (function fill() { loadMore(function () { if (pagesLoaded < want) fill(); }); })();
      lastUpdated = Date.now();
      tickUpdLabel();
    }).catch(function () { /* keep old data on transient failure */ });
  };

  function refreshStatsOnly() {
    api("/api/forms/admin/stats").then(function (r) {
      if (!r.ok) throw new Error("x");
      return r.json();
    }).then(function (d) {
      if (d.success) { renderStats(d); lastUpdated = Date.now(); tickUpdLabel(); }
    }).catch(function () {});
  }

  function delSub(key, tr) {
    if (!confirm("Delete this submission permanently?")) return;
    fetch("/api/forms/admin/subs?key=" + encodeURIComponent(key), {
      method: "DELETE",
      headers: { "Authorization": "Bearer " + token }
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.success) { tr.remove(); refreshStatsOnly(); }
      else alert("Delete failed.");
    }).catch(function () { alert("Delete failed."); });
  }

  // Row actions via delegation (rows are rendered dynamically).
  document.getElementById("subsBody").addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!btn) return;
    var tr = btn.closest("tr");
    var act = btn.getAttribute("data-act");
    if (act === "del") {
      delSub(tr.getAttribute("data-key"), tr);
    } else if (act === "reply") {
      var email = btn.getAttribute("data-email");
      var subj = tr.getAttribute("data-subject") || "your message";
      window.location.href = "mailto:" + email + "?subject=" + encodeURIComponent("Re: " + subj + " — NitroIDE");
    } else if (act === "more") {
      var msg = tr.querySelector(".msg");
      var clamped = msg.classList.toggle("clamp");
      btn.textContent = clamped ? "Show more" : "Show less";
    }
  });

  function boot() {
    api("/api/forms/admin/stats").then(function (r) {
      if (r.status === 401) throw new Error("Wrong token.");
      if (!r.ok) throw new Error("Archive not available yet (HTTP " + r.status + ").");
      return r.json();
    }).then(function (d) {
      loggedIn = true;
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("dash").classList.remove("hidden");
      document.getElementById("loginErr").classList.add("hidden");
      renderStats(d);
      document.getElementById("subsBody").innerHTML = "";
      cursor = null;
      pagesLoaded = 0;
      loadMore();
      lastUpdated = Date.now();
      tickUpdLabel();
    }).catch(function (e) {
      var el = document.getElementById("loginErr");
      el.textContent = e.message;
      el.classList.remove("hidden");
    });
  }

  // Live refresh: poll every 20s while the tab is visible. (KV itself can lag
  // writes by up to ~60s, so brand-new submissions may take a moment.)
  setInterval(function () { if (loggedIn && !document.hidden) refreshAll(); }, 20000);
  setInterval(function () { if (loggedIn) tickUpdLabel(); }, 5000);

  function renderStats(d) {
    var byForm = d.byForm || {};
    var bySource = d.bySource || {};
    var topSource = Object.keys(bySource).sort(function (a, b) { return bySource[b] - bySource[a]; })[0] || "—";
    document.getElementById("statsRow").innerHTML =
      stat(d.total, "total submissions") +
      stat(byForm.contact || 0, "contact") +
      stat(byForm.feedback || 0, "feedback") +
      stat(esc(topSource), "top source");
  }
  function stat(n, l) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + "</div></div>";
  }

  function rowHtml(s) {
    var from = s.form === "contact" && s.name
      ? esc(s.name) + " &lt;" + esc(s.email) + "&gt;"
      : "—";
    var atts = (s.attachments || []).map(function (a) { return "📎 " + esc(a.name); }).join(" ");
    var longMsg = s.message && s.message.length > 300;
    var replyBtn = (s.form === "contact" && s.email)
      ? "<button class='mini' data-act='reply' data-email='" + esc(s.email) + "'>Reply</button>"
      : "";
    return "<tr data-key='" + esc(s._key || "") + "' data-subject='" + esc(s.subject || "") + "'>" +
      "<td style='white-space:nowrap'>" + esc(s.when) + "</td>" +
      "<td><span class='pill " + (s.form === "contact" ? "contact" : "") + "'>" + esc(s.form) + "</span></td>" +
      "<td>" + from + "</td>" +
      "<td>" + esc(s.source || "—") + "</td>" +
      "<td><div class='msg" + (longMsg ? " clamp" : "") + "'>" + esc(s.message) + "</div>" +
      (longMsg ? "<div class='actions'><button class='mini' data-act='more'>Show more</button></div>" : "") +
      (atts ? "<div class='meta'>" + atts + " <span title='Files are in the notification email'>(in email)</span></div>" : "") +
      (s.subject ? "<div class='meta'>Subject: " + esc(s.subject) + "</div>" : "") +
      (s.country && s.country !== "unknown" ? "<div class='meta'>" + esc(s.country) + "</div>" : "") +
      "<div class='actions'>" + replyBtn + "<button class='mini danger' data-act='del'>Delete</button></div>" +
      "</td></tr>";
  }

  window.loadMore = function (cb) {
    var url = "/api/forms/admin/subs?limit=50" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
    api(url).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.success) throw new Error("load failed");
      cursor = d.cursor;
      var html = "";
      (d.subs || []).forEach(function (s) { html += rowHtml(s); });
      var body = document.getElementById("subsBody");
      body.insertAdjacentHTML("beforeend", html);
      pagesLoaded++;
      applyFilter();
      document.getElementById("moreBtn").classList.toggle("hidden", !cursor);
      if (!(d.subs || []).length && !body.children.length) {
        body.innerHTML = "<tr><td colspan='5' style='color:#71717a'>No submissions yet.</td></tr>";
      }
      if (cb) cb();
    }).catch(function () {
      var body = document.getElementById("subsBody");
      if (!body.children.length) {
        body.innerHTML = "<tr><td colspan='5' style='color:#f87171'>Could not load submissions. Try Refresh.</td></tr>";
      }
    });
  };

  window.exportCsv = function () {
    api("/api/forms/admin/export.csv").then(function (r) {
      if (!r.ok) throw new Error("export failed");
      return r.blob();
    }).then(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "nitroide-forms-export.csv";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }).catch(function () { alert("Export failed."); });
  };

  if (token) { document.getElementById("tokenInput").value = token; boot(); }
})();
</script>
</body>
</html>
